version: "3.8"
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - db
  gateway:
    build: ./integration
    ports:
      - "3001:3000"
    depends_on:
      - backend
  frontend:
    build: ./frontend
    ports:
      - "3002:3000"
    depends_on:
      - gateway
