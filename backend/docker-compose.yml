version: '3.8'
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://developer:localdev@db:5432/taskdb
      - JWT_SECRET=asessment
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=developer
      - DB_PASSWORD=localdev
      - DB_NAME=taskdb